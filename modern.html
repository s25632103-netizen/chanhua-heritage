<a href="research.html">研究緣起</a><a href="about.html">認識纏花</a><a href="history.html">歷史脈絡</a><a href="groups.html">族群與工藝</a><a href="modern.html">當代創新</a><a href="references.html">文獻資料</a></nav></div></header><header class="pagehead"><div class="kicker">CHANHUA · TAIWAN CRAFT</div><h1>當代創新</h1><p>傳統技藝不只被保存，也能持續創造新的可能。</p></header><main class="content"><h2>走進現代生活</h2><p>纏花的花卉與幾何造形，可以轉化為胸針、髮飾、耳環、吊飾或居家裝飾，讓傳統技法出現在更多生活情境。</p><h2>設計與跨域</h2><p>創作者能從當代配色、服裝搭配、展覽設計與數位影像取得靈感，在尊重傳統技法與文化脈絡的前提下，發展新的作品形式。</p><h2>傳承的可能</h2><p>透過體驗課程、社群分享、工藝展覽與數位典藏，讓更多人看見並理解纏花。</p></main><footer class="footer">纏花文化｜傳承與創新・校園文化介紹專題</footer><script src="toc.js"></script>
